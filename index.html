<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Luxe Interiors — Furniture &amp; Home Decor</title>
    <meta
      name="description"
      content="Group 5 microfrontend shell — catalog, cart and account composed into one storefront."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Work+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="shell-header">
      <a class="shell-brand" href="/" data-link>
        <span class="material-symbols-outlined">chair</span>
        Luxe Interiors
      </a>

      <nav class="shell-nav">
        <a href="/products" data-link>Shop</a>
        <a href="/account/orders" data-link>Orders</a>
        <a href="/account" data-link>Account</a>
      </nav>

      <a class="shell-cart" href="/cart" data-link aria-label="Cart">
        <span class="material-symbols-outlined">shopping_bag</span>
        <span id="cart-badge" class="shell-cart__badge" hidden>0</span>
      </a>
    </header>

    <main id="outlet"></main>

    <footer class="shell-footer">
      <p>© 2026 Luxe Interiors — Group 5 microfrontend integration.</p>
      <p class="shell-footer__meta">
        Catalog (React · MUI) · Cart &amp; Checkout (Lit · Material Web) · Account (Vue · Vuetify)
      </p>
    </footer>

    <script type="module" src="/src/shell.js"></script>
  </body>
</html>
